<!doctype html><meta charset="utf-8"><style>html,body{margin:0}</style>
<canvas id="stage" width="64" height="64" data-video-export data-export-duration="0.4"></canvas>
<script>
const c=document.querySelector('#stage'),x=c.getContext('2d'),start=performance.now();
function tick(){
 const elapsed=performance.now()-start;
 x.fillStyle=elapsed<1000?'rgb(240,20,20)':'rgb(20,20,240)';x.fillRect(0,0,64,64);
 requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
</script>
