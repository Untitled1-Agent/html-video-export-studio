<!doctype html>
<meta charset="utf-8">
<style>html,body{margin:0;background:#111}canvas{display:block}</style>
<canvas id="stage" width="640" height="360" data-video-export data-export-duration="3"></canvas>
<script>
const canvas = document.querySelector('#stage');
const ctx = canvas.getContext('2d');
window.demo = {
  renderAt(t) {
    ctx.fillStyle = '#201e1d'; ctx.fillRect(0,0,640,360);
    ctx.fillStyle = '#f3f2f2'; ctx.font = '700 28px system-ui';
    ctx.fillText('JavaScript method timeline', 24, 48);
    ctx.fillStyle = '#ec3013';
    ctx.fillRect(30 + Math.min(1, Math.max(0,t/3))*500, 145, 80, 80);
  }
};
window.demo.renderAt(0);
</script>
