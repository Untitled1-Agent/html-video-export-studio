name: Add manual CRF override

on:
  push:
    branches: [feat/social-crf-x265-quality]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/social-crf-x265-quality
      - name: Install patch dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Patch manual CRF support
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(f'{path}: expected {count} matches, found {actual}')
              p.write_text(text.replace(old, new), encoding='utf-8')

          # Model + project persistence.
          replace('models.py',
              '    output_profile_key: str = "h264_420_mp4"\n    processing: ProcessingConfig = field(default_factory=ProcessingConfig)\n',
              '    output_profile_key: str = "h264_420_mp4"\n    video_crf: Optional[float] = None  # None uses the H.264/H.265 profile default.\n    processing: ProcessingConfig = field(default_factory=ProcessingConfig)\n')
          replace('models.py',
              "        if self.output_profile_key not in OUTPUT_PROFILES:\n            raise ValueError('Unknown output profile: ' + self.output_profile_key)\n        if self.processing.preset_key not in PROCESSING_PRESETS:\n",
              "        if self.output_profile_key not in OUTPUT_PROFILES:\n            raise ValueError('Unknown output profile: ' + self.output_profile_key)\n        profile = OUTPUT_PROFILES[self.output_profile_key]\n        if self.video_crf is not None:\n            crf = strict_float(self.video_crf)\n            if not 0 <= crf <= 51:\n                raise ValueError('Manual CRF must be between 0 and 51.')\n            if profile.video_encoder not in {'libx264', 'libx265'} or '-crf' not in profile.video_args:\n                raise ValueError('Manual CRF override is available only for H.264/H.265 profiles.')\n        if self.processing.preset_key not in PROCESSING_PRESETS:\n")
          replace('models.py',
              '        fps=strict_int(render_data.get("fps", render_base.fps)),\n        cpu_threads=strict_int(render_data.get("cpu_threads", render_base.cpu_threads)),\n',
              '        fps=strict_int(render_data.get("fps", render_base.fps)),\n        video_crf=(\n            strict_float(render_data["video_crf"])\n            if render_data.get("video_crf") not in (None, "")\n            else None\n        ),\n        cpu_threads=strict_int(render_data.get("cpu_threads", render_base.cpu_threads)),\n')

          # CLI.
          replace('cli.py', 'import argparse\nimport json\n', 'import argparse\nimport json\nimport math\n')
          replace('cli.py',
              'def build_parser() -> argparse.ArgumentParser:\n',
              '''def _crf(value: str) -> float:\n    try:\n        crf = float(value)\n    except ValueError as exc:\n        raise argparse.ArgumentTypeError("CRF must be a number.") from exc\n    if not math.isfinite(crf) or not 0 <= crf <= 51:\n        raise argparse.ArgumentTypeError("CRF must be between 0 and 51.")\n    return crf\n\n\ndef build_parser() -> argparse.ArgumentParser:\n''')
          replace('cli.py',
              '    parser.add_argument("--profile", choices=OUTPUT_PROFILES)\n    parser.add_argument("--processing", choices=PROCESSING_PRESETS)\n',
              '    parser.add_argument("--profile", choices=OUTPUT_PROFILES)\n    parser.add_argument("--crf", type=_crf, metavar="CRF",\n                        help="Override H.264/H.265 CRF (0-51); omit to use the profile default.")\n    parser.add_argument("--processing", choices=PROCESSING_PRESETS)\n')
          replace('cli.py',
              '    if args.profile:\n        job.render.output_profile_key = args.profile\n    if args.processing:\n',
              '    if args.profile:\n        job.render.output_profile_key = args.profile\n    if args.crf is not None:\n        job.render.video_crf = args.crf\n    if args.processing:\n')

          # Encoder argument replacement without mutating immutable profile presets.
          marker = "\ndef build_audio_output_args(audio: AudioConfig, profile: OutputProfile) -> list[str]:\n"
          helper = '''\ndef build_video_output_args(profile: OutputProfile, crf_override: float | None = None) -> list[str]:\n    """Return profile video args with an optional H.264/H.265 CRF override."""\n    args = list(profile.video_args)\n    if crf_override is None:\n        return args\n    from models import strict_float\n    crf = strict_float(crf_override)\n    if not 0 <= crf <= 51:\n        raise ValueError('Manual CRF must be between 0 and 51.')\n    if profile.video_encoder not in {'libx264', 'libx265'} or '-crf' not in args:\n        raise ValueError('Manual CRF override is available only for H.264/H.265 profiles.')\n    index = args.index('-crf')\n    args[index + 1] = f'{crf:g}'\n    return args\n\n\ndef build_audio_output_args(audio: AudioConfig, profile: OutputProfile) -> list[str]:\n'''
          replace('media_pipeline.py', marker, helper)
          replace('renderer.py',
              '        from media_pipeline import color_pipeline, ffmpeg_thread_plan\n',
              '        from media_pipeline import color_pipeline, ffmpeg_thread_plan, build_video_output_args\n')
          replace('renderer.py',
              '        command.extend(profile.video_args)\n        command.extend([\'-threads:v\', str(threads.encoder)])\n',
              '        command.extend(build_video_output_args(profile, job.render.video_crf))\n        command.extend([\'-threads:v\', str(threads.encoder)])\n')

          # Desktop Job Settings.
          replace('app.py',
              '        self.profile_var = StringVar(value=OUTPUT_PROFILES[config.render.output_profile_key].label)\n        self.next_to_source_var = BooleanVar(value=config.render.save_next_to_source)\n',
              '        self.profile_var = StringVar(value=OUTPUT_PROFILES[config.render.output_profile_key].label)\n        self.crf_var = StringVar(value="" if config.render.video_crf is None else f"{config.render.video_crf:g}")\n        self.next_to_source_var = BooleanVar(value=config.render.save_next_to_source)\n')
          replace('app.py',
              '''        ttk.Label(tab, textvariable=self.profile_description_var, wraplength=620).grid(\n            row=3, column=1, columnspan=2, sticky="w", padx=(12, 8), pady=(0, 8)\n        )\n        self.next_to_source_check = ttk.Checkbutton(\n            tab, text="Save beside source HTML",\n            variable=self.next_to_source_var, command=self._toggle_output\n        )\n        self.next_to_source_check.grid(row=4, column=1, sticky="w", padx=(12, 8), pady=5)\n''',
              '''        ttk.Label(tab, textvariable=self.profile_description_var, wraplength=620).grid(\n            row=3, column=1, columnspan=2, sticky="w", padx=(12, 8), pady=(0, 8)\n        )\n        self.crf_widget = ttk.Spinbox(tab, from_=0, to=51, increment=0.5, textvariable=self.crf_var)\n        self._row(\n            tab, 4, "CRF override (0–51)", self.crf_widget,\n            "Blank = profile default. Lower is higher quality/larger. H.264/H.265 only.",\n        )\n        self.next_to_source_check = ttk.Checkbutton(\n            tab, text="Save beside source HTML",\n            variable=self.next_to_source_var, command=self._toggle_output\n        )\n        self.next_to_source_check.grid(row=5, column=1, sticky="w", padx=(12, 8), pady=5)\n''')
          replace('app.py',
              '''        self._row(tab, 5, "Output folder", output_row)\n        self._row(tab, 6, "Filename template", ttk.Entry(tab, textvariable=self.filename_var), "Fields: {stem}, {scale}, {fps}, {profile}, {processing}, {ext}")\n        ttk.Checkbutton(tab, text="Overwrite existing output", variable=self.overwrite_var).grid(row=7, column=1, sticky="w", padx=(12, 8), pady=5)\n        from models import MAX_CPU_THREADS\n        self._row(tab, 8, "CPU threads per export",\n''',
              '''        self._row(tab, 6, "Output folder", output_row)\n        self._row(tab, 7, "Filename template", ttk.Entry(tab, textvariable=self.filename_var), "Fields: {stem}, {scale}, {fps}, {profile}, {processing}, {ext}")\n        ttk.Checkbutton(tab, text="Overwrite existing output", variable=self.overwrite_var).grid(row=8, column=1, sticky="w", padx=(12, 8), pady=5)\n        from models import MAX_CPU_THREADS\n        self._row(tab, 9, "CPU threads per export",\n''')
          replace('app.py',
              '''        if key and hasattr(self, "audio_encoding_var"):\n            profile = OUTPUT_PROFILES[key]\n            codec = {"aac": "AAC-LC", "libopus": "Opus", "pcm_s24le": "24-bit PCM"}.get(profile.audio_codec, profile.audio_codec)\n''',
              '''        if key:\n            profile = OUTPUT_PROFILES[key]\n            supports_crf = profile.video_encoder in {'libx264', 'libx265'} and '-crf' in profile.video_args\n            if hasattr(self, 'crf_widget'):\n                self.crf_widget.configure(state='normal' if supports_crf else 'disabled')\n                if not supports_crf:\n                    self.crf_var.set('')\n        if key and hasattr(self, "audio_encoding_var"):\n            profile = OUTPUT_PROFILES[key]\n            codec = {"aac": "AAC-LC", "libopus": "Opus", "pcm_s24le": "24-bit PCM"}.get(profile.audio_codec, profile.audio_codec)\n''')
          replace('app.py',
              '        self.profile_var.set(OUTPUT_PROFILES[fresh.render.output_profile_key].label)\n        self.processing_var.set(PROCESSING_PRESETS[fresh.render.processing.preset_key].label)\n',
              '        self.profile_var.set(OUTPUT_PROFILES[fresh.render.output_profile_key].label)\n        self.crf_var.set("" if fresh.render.video_crf is None else f"{fresh.render.video_crf:g}")\n        self.processing_var.set(PROCESSING_PRESETS[fresh.render.processing.preset_key].label)\n')
          replace('app.py',
              '            config.render.output_profile_key = OUTPUT_PROFILE_LABEL_TO_KEY[self.profile_var.get()]\n            config.render.save_next_to_source = bool(self.next_to_source_var.get())\n',
              '            config.render.output_profile_key = OUTPUT_PROFILE_LABEL_TO_KEY[self.profile_var.get()]\n            config.render.video_crf = self._optional_float(self.crf_var.get())\n            config.render.save_next_to_source = bool(self.next_to_source_var.get())\n')

          # Permanent core/CLI/command regressions.
          replace('tests/test_quality_profiles.py',
              'from presets import OUTPUT_PROFILES, RECIPES\n',
              '''from cli import build_parser, make_job\nfrom media_pipeline import build_video_output_args\nfrom models import dataclass_to_dict, job_config_from_dict\nfrom presets import OUTPUT_PROFILES, RECIPES, apply_recipe\nfrom renderer import HtmlVideoRenderer\n''')
          insert = '''\n    def test_manual_crf_override_replaces_only_profile_crf(self):\n        social = OUTPUT_PROFILES["h264_420_mp4"]\n        hevc = OUTPUT_PROFILES["h265_420_mp4"]\n        self.assertEqual(option(tuple(build_video_output_args(social)), "-crf"), "8")\n        self.assertEqual(option(tuple(build_video_output_args(social, 6.5)), "-crf"), "6.5")\n        self.assertEqual(option(tuple(build_video_output_args(hevc, 7)), "-crf"), "7")\n        self.assertEqual(option(social.video_args, "-crf"), "8")\n        self.assertEqual(option(hevc.video_args, "-crf"), "10")\n\n    def test_manual_crf_cli_project_roundtrip_and_recipe_reset(self):\n        args = build_parser().parse_args(["clip.html", "--profile", "h265_420_mp4", "--crf", "7.5"])\n        job = make_job("clip.html", args)\n        self.assertEqual(job.render.video_crf, 7.5)\n        payload = dataclass_to_dict(job)\n        restored = job_config_from_dict(payload)\n        self.assertEqual(restored.render.video_crf, 7.5)\n        del payload["render"]["video_crf"]\n        self.assertIsNone(job_config_from_dict(payload).render.video_crf)\n        self.assertIsNone(apply_recipe(restored, "social_delivery").render.video_crf)\n\n    def test_manual_crf_validation_rejects_bad_values_and_non_h26x_profiles(self):\n        job = RECIPES["social_delivery"].create_job("clip.html")\n        for value in (-1, 51.1, float("nan"), True):\n            with self.subTest(value=value):\n                job.render.video_crf = value\n                with self.assertRaises(ValueError):\n                    job.render.validate(for_export=False)\n        job.render.video_crf = 8\n        job.render.output_profile_key = "prores_hq_mov"\n        with self.assertRaisesRegex(ValueError, "H.264/H.265"):\n            job.render.validate(for_export=False)\n\n    def test_renderer_command_uses_manual_crf_override(self):\n        job = RECIPES["social_delivery"].create_job("clip.html")\n        job.render.video_crf = 5.5\n        renderer = HtmlVideoRenderer()\n        renderer._ffmpeg_exe = "ffmpeg"\n        command = renderer._build_ffmpeg_command(job, Path("out.mp4"), 1.0, "")\n        self.assertEqual(command[command.index("-crf") + 1], "5.5")\n\n'''
          replace('tests/test_quality_profiles.py',
              '\n\nif __name__ == "__main__":\n    unittest.main()\n',
              insert + '\nif __name__ == "__main__":\n    unittest.main()\n')

          # Real Tk coverage for the new Job Settings control.
          Path('tests/test_quality_ui.py').write_text('''"""Desktop CRF override controls; use xvfb-run on Linux."""\nfrom __future__ import annotations\n\nimport os\nimport sys\nimport tempfile\nimport unittest\nimport uuid\nfrom pathlib import Path\nfrom unittest.mock import patch\n\nfrom models import QueueJob\nfrom presets import OUTPUT_PROFILES, RECIPES\nfrom settings_store import AppSettings\n\n\n@unittest.skipUnless(os.environ.get("DISPLAY") or sys.platform in {"win32", "darwin"},\n                     "Desktop display required; run with xvfb-run")\nclass QualityUITests(unittest.TestCase):\n    def setUp(self):\n        from app import StudioApp\n        self.tmp = tempfile.TemporaryDirectory()\n        self.root = Path(self.tmp.name)\n        self.html = self.root / "quality.html"\n        self.html.write_text('<svg width="64" height="96" data-video-export></svg>', encoding="utf-8")\n        self.patches = [patch("app.load_settings", return_value=AppSettings()),\n                        patch("app.save_settings"),\n                        patch.object(StudioApp, "_check_environment_async"),\n                        patch("app.messagebox.showerror")]\n        for item in self.patches:\n            item.start()\n        self.app = StudioApp()\n        self.app.update_idletasks()\n        self.job = QueueJob(uuid.uuid4().hex, RECIPES["social_delivery"].create_job(str(self.html)))\n\n    def tearDown(self):\n        self.app.destroy()\n        for item in reversed(self.patches):\n            item.stop()\n        self.tmp.cleanup()\n\n    def test_editor_saves_manual_crf_and_recipe_resets_it(self):\n        from app import JobEditor\n        editor = JobEditor(self.app, self.job)\n        self.assertEqual(editor.crf_var.get(), "")\n        editor.crf_var.set("6.5")\n        editor._save()\n        self.assertIsNotNone(editor.result)\n        self.assertEqual(editor.result.render.video_crf, 6.5)\n        self.assertIsNone(self.job.config.render.video_crf)\n\n        self.job.config.render.video_crf = 6.5\n        editor = JobEditor(self.app, self.job)\n        editor._apply_recipe()\n        self.assertEqual(editor.crf_var.get(), "")\n        editor.destroy()\n\n    def test_editor_disables_override_for_non_h26x_profile(self):\n        from app import JobEditor\n        editor = JobEditor(self.app, self.job)\n        editor.crf_var.set("7")\n        editor.profile_var.set(OUTPUT_PROFILES["prores_hq_mov"].label)\n        editor._update_profile_description()\n        self.assertEqual(editor.crf_var.get(), "")\n        self.assertEqual(str(editor.crf_widget.cget("state")), "disabled")\n        editor.destroy()\n\n    def test_editor_rejects_out_of_range_crf(self):\n        from app import JobEditor\n        editor = JobEditor(self.app, self.job)\n        editor.crf_var.set("52")\n        editor._save()\n        self.assertIsNone(editor.result)\n        editor.destroy()\n\n\nif __name__ == "__main__":\n    unittest.main()\n''', encoding='utf-8')

          # User-facing docs.
          replace('README.md',
              '| H.265/HEVC Main 4:2:0 | MP4 | Efficient delivery where HEVC support is known | Less universal playback/upload compatibility than H.264 |\n| VP9 4:4:4 | WebM | Web-oriented delivery | Encoding speed and player/editor support vary |\n',
              '| H.265/HEVC Main 4:2:0 | MP4 | Efficient delivery where HEVC support is known | Less universal playback/upload compatibility than H.264 |\n| VP9 4:4:4 | WebM | Web-oriented delivery | Encoding speed and player/editor support vary |\n\nFor H.264 and H.265/HEVC profiles, **CRF can be overridden per job** in Job Settings or with `--crf`. Leave it blank/omit the flag to use the tested profile default (Social H.264 = 8; HEVC = 10). Lower CRF means higher quality and usually larger files; the allowed override range is 0–51.\n')
          replace('docs/CLI.md',
              '`--recipe` chooses initial settings; explicit flags override them. `--scale`, `--fps`, `--profile`, `--processing` affect the output.',
              '`--recipe` chooses initial settings; explicit flags override them. `--scale`, `--fps`, `--profile`, `--crf`, `--processing` affect the output. `--crf 0..51` is available for H.264/H.265 profiles; omit it to keep the selected profile default. Lower CRF means higher quality and usually larger files.')
          replace('docs/CLI.md',
              'There is **no** `--project`, `--workers`, or external-audio flag in this CLI release. Projects, parallel queueing, selector index, manual intrinsic dimensions, custom processing details and audio are accessible through the desktop/Python API.',
              'There is **no** `--project` or `--workers` flag in this CLI release. Projects, parallel queueing, selector index, manual intrinsic dimensions, and custom processing details are accessible through the desktop/Python API; external soundtracks are available through the audio flags documented below.')
          replace('docs/USER_GUIDE.md',
              'Scale supports 0.25×–4×. Fractional scale uses Chromium-style pixel rounding. Frame rate is an integer 1–240; 29.97/59.94 rational rates are not currently represented by the model. Higher capture fps does not synthesize motion in a video/raster asset authored at a lower rate.\n',
              'Scale supports 0.25×–4×. Fractional scale uses Chromium-style pixel rounding. Frame rate is an integer 1–240; 29.97/59.94 rational rates are not currently represented by the model. Higher capture fps does not synthesize motion in a video/raster asset authored at a lower rate.\n\nFor H.264 and H.265/HEVC output profiles, **CRF override** is optional per job. Leave the field blank to use the profile default (Social H.264 = 8; HEVC = 10). Lower values increase quality and usually file size. Overrides are validated from 0 through 51 and are deliberately unavailable for ProRes, VP9, and the exact RGB master. Applying a recipe clears a manual CRF because recipes reset codec settings.\n')
          replace('docs/DELIVERY_COMPATIBILITY.md',
              'default because browser/player/upload acceptance is less universal than H.264.\n\nRGB-to-YUV conversion remains explicit:',
              'default because browser/player/upload acceptance is less universal than H.264.\n\nBoth H.264 and HEVC allow an optional per-job CRF override from 0–51. Leaving it blank keeps the tested profile default. Lower CRF raises quality and usually file size; the 30M/60M VBV guardrail still applies, so a very low manual CRF is a request for higher quality within that delivery bound rather than an uncapped mode.\n\nRGB-to-YUV conversion remains explicit:')
          replace('CHANGELOG.md',
              '- Add an opt-in H.265/HEVC Main 4:2:0 MP4 profile using libx265 CRF 10, hvc1 sample entries, fast-start MP4, explicit BT.709/sRGB metadata, and AAC-LC audio. Social delivery remains H.264 by default for broader playback/upload compatibility.\n',
              '- Add an opt-in H.265/HEVC Main 4:2:0 MP4 profile using libx265 CRF 10, hvc1 sample entries, fast-start MP4, explicit BT.709/sRGB metadata, and AAC-LC audio. Social delivery remains H.264 by default for broader playback/upload compatibility.\n- Add an optional per-job H.264/H.265 CRF override (0–51) in the desktop, CLI, Python/project model, and renderer while preserving each profile default when unset.\n')
          PY

          python tools/generate_reference.py
          python -m unittest discover -s tests -p test_quality_profiles.py -v
          python tools/check_docs.py
      - name: Commit manual CRF support
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add models.py cli.py media_pipeline.py renderer.py app.py tests/test_quality_profiles.py tests/test_quality_ui.py README.md docs/CLI.md docs/USER_GUIDE.md docs/DELIVERY_COMPATIBILITY.md docs/CONFIGURATION.md CHANGELOG.md
          git commit -m 'feat: add per-job manual CRF override'
          git push origin HEAD:feat/social-crf-x265-quality
