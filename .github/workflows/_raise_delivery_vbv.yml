name: Raise delivery VBV after quality stress test

on:
  push:
    branches: [feat/social-crf-x265-quality]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/social-crf-x265-quality
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Install project dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Apply measured VBV fix and regenerate docs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          presets = Path('presets.py')
          text = presets.read_text(encoding='utf-8')
          old = text
          text = text.replace('"-maxrate", "20M",\n            "-bufsize", "40M",', '"-maxrate", "30M",\n            "-bufsize", "60M",')
          if text == old:
              raise SystemExit('Expected 20M/40M delivery VBV pair was not found.')
          presets.write_text(text, encoding='utf-8')

          tests = Path('tests/test_quality_profiles.py')
          text = tests.read_text(encoding='utf-8').replace("self.assertEqual(_arg_value(args, '-maxrate'), '20M')", "self.assertEqual(_arg_value(args, '-maxrate'), '30M')").replace("self.assertEqual(_arg_value(args, '-bufsize'), '40M')", "self.assertEqual(_arg_value(args, '-bufsize'), '60M')")
          tests.write_text(text, encoding='utf-8')

          delivery = Path('docs/DELIVERY_COMPATIBILITY.md')
          text = delivery.read_text(encoding='utf-8').replace(
              'a 20 Mb/s VBV ceiling\nwith a 40 Mb buffer bound delivery complexity.',
              'a 30 Mb/s VBV ceiling\nwith a 60 Mb buffer bound delivery complexity. The higher bound preserves CRF 8 quality\non sustained high-detail 1080×1920 / 60 fps motion while still bounding delivery spikes.'
          )
          delivery.write_text(text, encoding='utf-8')

          changelog = Path('CHANGELOG.md')
          text = changelog.read_text(encoding='utf-8')
          marker = '- Raise Social H.264 quality from CRF 12 to CRF 8 while keeping CRF rate control.\n'
          extra = '- Raise the Social/HEVC VBV bound from 20M/40M to 30M/60M after sustained-detail stress renders showed the old ceiling could override CRF quality.\n'
          if extra not in text:
              if marker in text:
                  text = text.replace(marker, marker + extra)
              else:
                  text = extra + text
          changelog.write_text(text, encoding='utf-8')
          PY
          python tools/generate_reference.py
          python -m unittest tests.test_quality_profiles -v
          python tools/check_docs.py
      - name: Commit measured fix if needed
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add presets.py tests/test_quality_profiles.py docs/DELIVERY_COMPATIBILITY.md docs/CONFIGURATION.md CHANGELOG.md
          git commit -m 'fix: preserve CRF quality under sustained detail'
          git push origin HEAD:feat/social-crf-x265-quality
