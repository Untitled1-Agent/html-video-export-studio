name: Quality evidence
on:
  push:
    branches: ['feat/social-quality-6000']
permissions:
  contents: read
jobs:
  source-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 16cc54187a392e47a7d05db9f1c07e95227ff89a
          persist-credentials: false
      - name: Archive tracked source only
        run: |
          mkdir -p evidence
          git archive --format=tar HEAD > evidence/source.tar
          git rev-parse HEAD > evidence/commit.txt
          sha256sum evidence/source.tar > evidence/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: quality-source-pinned
          path: evidence/
          retention-days: 1
          if-no-files-found: error
