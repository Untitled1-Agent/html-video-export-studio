name: Quality evidence
on:
  push:
    branches: ['feat/social-quality-6000']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quality-evidence-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Archive only tracked source (no credentials or local media)
        run: |
          mkdir -p evidence
          git archive --format=tar HEAD > evidence/source.tar
          git rev-parse HEAD > evidence/commit.txt
          sha256sum evidence/source.tar > evidence/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: quality-source-${{ github.sha }}
          path: evidence/
          retention-days: 7
          if-no-files-found: error
