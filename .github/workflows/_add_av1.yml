name: Add AV1 support
on:
  push:
    branches: [feat/social-crf-x265-quality]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/social-crf-x265-quality
      - run: python -m pip install -r requirements-dev.txt
      - name: Patch AV1 profile and regressions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess, sys

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}: {old[:100]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          def insert_before(path, marker, lines):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(marker)
              if count != 1:
                  raise SystemExit(f'{path}: expected one marker, found {count}: {marker!r}')
              block = '\n'.join(lines) + '\n'
              p.write_text(text.replace(marker, block + marker, 1), encoding='utf-8')

          insert_before('presets.py', '    "vp9_webm": OutputProfile(', [
              '    "av1_420_mp4": OutputProfile(',
              '        key="av1_420_mp4",',
              '        label="High Efficiency — AV1 4:2:0 MP4",',
              '        description=(',
              '            "High-quality AV1 Main 8-bit delivery using libaom-av1 CRF 18 and av01 sample entries. "',
              '            "Compression efficiency is strong but software encoding is slower and upload/editor support "',
              '            "is less universal; Social delivery intentionally remains H.264 by default."',
              '        ),',
              '        extension="mp4",',
              '        video_encoder="libaom-av1",',
              '        video_args=(',
              '            "-noautoscale",',
              '            "-c:v", "libaom-av1",',
              '            "-cpu-used", "6",',
              '            "-row-mt", "1",',
              '            "-crf", "18",',
              '            "-b:v", "0",',
              '            "-pix_fmt", "yuv420p",',
              '            "-profile:v", "0",',
              '            "-tag:v", "av01",',
              '            "-g", "120",',
              '            "-color_range", "tv",',
              '            "-color_primaries", "bt709",',
              '            "-color_trc", "iec61966-2-1",',
              '            "-colorspace", "bt709",',
              '        ),',
              '        audio_codec="aac",',
              '        audio_args=("-c:a", "aac", "-profile:a", "aac_low", "-b:a", "256k", "-ar", "48000", "-ac", "2"),',
              '        requires_even_dimensions=True,',
              '    ),',
          ])

          replace_once('models.py',
              'video_crf: Optional[float] = None  # None uses the H.264/H.265 profile default.',
              'video_crf: Optional[float] = None  # None uses the H.264/H.265/AV1 profile default.')
          replace_once('models.py',
              "profile.video_encoder not in {'libx264', 'libx265'} or '-crf' not in profile.video_args",
              "profile.video_encoder not in {'libx264', 'libx265', 'libaom-av1'} or '-crf' not in profile.video_args")
          replace_once('models.py',
              'Manual CRF override is available only for H.264/H.265 profiles.',
              'Manual CRF override is available only for H.264/H.265/AV1 profiles.')

          replace_once('media_pipeline.py',
              'Return profile video args with an optional H.264/H.265 CRF override.',
              'Return profile video args with an optional H.264/H.265/AV1 CRF override.')
          replace_once('media_pipeline.py',
              "profile.video_encoder not in {'libx264', 'libx265'} or '-crf' not in args",
              "profile.video_encoder not in {'libx264', 'libx265', 'libaom-av1'} or '-crf' not in args")
          replace_once('media_pipeline.py',
              'Manual CRF override is available only for H.264/H.265 profiles.',
              'Manual CRF override is available only for H.264/H.265/AV1 profiles.')

          replace_once('cli.py',
              'Override H.264/H.265 CRF (1-51); omit to use the profile default.',
              'Override H.264/H.265/AV1 CRF (1-51); omit to use the profile default.')
          replace_once('app.py',
              '"Blank = profile default. Lower is higher quality/larger. H.264/H.265 only.",',
              '"Blank = profile default. Lower is higher quality/larger. H.264/H.265/AV1 only.",')
          replace_once('app.py',
              "profile.video_encoder in {'libx264', 'libx265'} and '-crf' in profile.video_args",
              "profile.video_encoder in {'libx264', 'libx265', 'libaom-av1'} and '-crf' in profile.video_args")

          insert_before('tests/test_quality_profiles.py',
              '    def test_hevc_and_social_profiles_keep_explicit_delivery_colour_metadata(self):\n', [
              '    def test_av1_is_opt_in_portable_high_efficiency_profile(self):',
              '        profile = OUTPUT_PROFILES["av1_420_mp4"]',
              '        self.assertEqual(profile.video_encoder, "libaom-av1")',
              '        self.assertEqual(option(profile.video_args, "-crf"), "18")',
              '        self.assertEqual(option(profile.video_args, "-b:v"), "0")',
              '        self.assertEqual(option(profile.video_args, "-cpu-used"), "6")',
              '        self.assertEqual(option(profile.video_args, "-row-mt"), "1")',
              '        self.assertEqual(option(profile.video_args, "-pix_fmt"), "yuv420p")',
              '        self.assertEqual(option(profile.video_args, "-profile:v"), "0")',
              '        self.assertEqual(option(profile.video_args, "-tag:v"), "av01")',
              '        self.assertEqual(option(profile.video_args, "-g"), "120")',
              '        self.assertNotIn("-maxrate", profile.video_args)',
              '        self.assertNotIn("-bufsize", profile.video_args)',
              '        self.assertEqual(profile.audio_codec, "aac")',
              '        self.assertIn("aac_low", profile.audio_args)',
              '',
          ])
          replace_once('tests/test_quality_profiles.py',
              'for key in ("h264_420_mp4", "h265_420_mp4"):',
              'for key in ("h264_420_mp4", "h265_420_mp4", "av1_420_mp4"):')

          insert_before('tests/test_quality_profiles.py',
              '    def test_manual_crf_override_replaces_only_profile_crf(self):\n', [
              '    def test_packaged_ffmpeg_fallback_can_encode_and_decode_av1(self):',
              '        """The wheel fallback must make the user-facing AV1 profile usable."""',
              '        ffmpeg = imageio_ffmpeg.get_ffmpeg_exe()',
              '        width, height, frames = 32, 32, 4',
              '        payload = bytearray()',
              '        for frame in range(frames):',
              '            for y in range(height):',
              '                for x in range(width):',
              '                    payload.extend(((x * 7 + frame * 17) % 256,',
              '                                    (y * 9 + frame * 23) % 256,',
              '                                    ((x + y) * 5 + frame * 29) % 256))',
              '        with tempfile.TemporaryDirectory() as directory:',
              '            output = Path(directory) / "av1-fallback.mp4"',
              '            encoded = subprocess.run([',
              '                ffmpeg, "-hide_banner", "-loglevel", "error", "-y",',
              '                "-f", "rawvideo", "-pix_fmt", "rgb24",',
              '                "-s:v", f"{width}x{height}", "-r", "10", "-i", "pipe:0",',
              '                "-frames:v", str(frames), "-c:v", "libaom-av1", "-cpu-used", "8",',
              '                "-row-mt", "1", "-crf", "30", "-b:v", "0",',
              '                "-pix_fmt", "yuv420p", "-profile:v", "0", "-tag:v", "av01",',
              '                "-movflags", "+faststart", str(output),',
              '            ], input=bytes(payload), capture_output=True, timeout=60)',
              '            self.assertEqual(encoded.returncode, 0, encoded.stderr.decode(errors="replace"))',
              '            self.assertTrue(output.is_file() and output.stat().st_size > 0)',
              '            decoded = subprocess.run([',
              '                ffmpeg, "-hide_banner", "-loglevel", "error", "-xerror",',
              '                "-i", str(output), "-map", "0:v:0", "-f", "null", "-",',
              '            ], capture_output=True, timeout=30)',
              '            self.assertEqual(decoded.returncode, 0, decoded.stderr.decode(errors="replace"))',
              '            self.assertFalse(decoded.stderr)',
              '',
          ])
          replace_once('tests/test_quality_profiles.py',
              '        hevc = OUTPUT_PROFILES["h265_420_mp4"]\n',
              '        hevc = OUTPUT_PROFILES["h265_420_mp4"]\n        av1 = OUTPUT_PROFILES["av1_420_mp4"]\n')
          replace_once('tests/test_quality_profiles.py',
              '        self.assertEqual(option(tuple(build_video_output_args(hevc, 7)), "-crf"), "7")\n',
              '        self.assertEqual(option(tuple(build_video_output_args(hevc, 7)), "-crf"), "7")\n        self.assertEqual(option(tuple(build_video_output_args(av1, 12.5)), "-crf"), "12.5")\n        self.assertEqual(option(tuple(build_video_output_args(av1, 12.5)), "-b:v"), "0")\n')
          replace_once('tests/test_quality_profiles.py',
              '        self.assertEqual(option(hevc.video_args, "-crf"), "10")\n',
              '        self.assertEqual(option(hevc.video_args, "-crf"), "10")\n        self.assertEqual(option(av1.video_args, "-crf"), "18")\n')
          replace_once('tests/test_quality_profiles.py',
              'with self.assertRaisesRegex(ValueError, "H.264/H.265"):',
              'with self.assertRaisesRegex(ValueError, "H.264/H.265/AV1"):')

          replace_once('tests/test_quality_cli_media.py',
              'Fresh end-to-end CLI/browser/media regression for Social H.264 and HEVC.',
              'Fresh end-to-end CLI/browser/media regression for Social H.264, HEVC, and AV1.')
          replace_once('tests/test_quality_cli_media.py',
              '    def test_real_cli_browser_renders_h264_and_hevc_with_audio(self):\n        h264 = self.render("h264_420_mp4", "social-h264.mp4")\n        hevc = self.render("h265_420_mp4", "hevc.mp4")\n        self.assert_media(h264, "h264", "avc1")\n        self.assert_media(hevc, "hevc", "hvc1")\n',
              '    def test_real_cli_browser_renders_h264_hevc_and_av1_with_audio(self):\n        h264 = self.render("h264_420_mp4", "social-h264.mp4")\n        hevc = self.render("h265_420_mp4", "hevc.mp4")\n        av1 = self.render("av1_420_mp4", "av1.mp4")\n        self.assert_media(h264, "h264", "avc1")\n        self.assert_media(hevc, "hevc", "hvc1")\n        self.assert_media(av1, "av1", "av01")\n')

          replace_once('tests/test_quality_ui.py',
              '        editor.crf_var.set("7")\n        editor.profile_var.set(OUTPUT_PROFILES["prores_hq_mov"].label)\n',
              '        editor.crf_var.set("7")\n        editor.profile_var.set(OUTPUT_PROFILES["av1_420_mp4"].label)\n        editor._update_profile_description()\n        self.assertEqual(editor.crf_var.get(), "7")\n        self.assertEqual(str(editor.crf_widget.cget("state")), "normal")\n        editor.profile_var.set(OUTPUT_PROFILES["prores_hq_mov"].label)\n')

          replace_once('README.md',
              '| H.265/HEVC Main 4:2:0 | MP4 | Efficient delivery where HEVC support is known | Less universal playback/upload compatibility than H.264 |\n',
              '| H.265/HEVC Main 4:2:0 | MP4 | Efficient delivery where HEVC support is known | Less universal playback/upload compatibility than H.264 |\n| AV1 Main 4:2:0 | MP4 | Modern high-efficiency delivery | Slow software encoding; upload/editor support varies |\n')
          replace_once('README.md',
              'For H.264 and H.265/HEVC profiles, **CRF can be overridden per job** in Job Settings or with `--crf`. Leave it blank/omit the flag to use the tested profile default (Social H.264 = 8; HEVC = 10). Lower CRF means higher quality and usually larger files; the allowed override range is 1–51.',
              'For H.264, H.265/HEVC, and AV1 profiles, **CRF can be overridden per job** in Job Settings or with `--crf`. Leave it blank/omit the flag to use the tested profile default (Social H.264 = 8; HEVC = 10; AV1 = 18). Lower CRF means higher quality and usually larger files; the common override range is 1–51.')
          replace_once('docs/AUDIO.md',
              '| H.264 or H.265/HEVC MP4, including Social delivery | AAC-LC |',
              '| H.264, H.265/HEVC, or AV1 MP4, including Social delivery | AAC-LC |')
          replace_once('docs/CLI.md',
              'python cli.py animation.html --recipe exact_source_master --trim-start 1 --trim-end 4 --hold-end .5 --output excerpt.mp4\n',
              'python cli.py animation.html --recipe exact_source_master --trim-start 1 --trim-end 4 --hold-end .5 --output excerpt.mp4\npython cli.py animation.html --profile av1_420_mp4 --crf 18 --output av1.mp4\n')
          replace_once('docs/CLI.md',
              '`--crf 0..51` is available for H.264/H.265 profiles; omit it to keep the selected profile default.',
              '`--crf 1..51` is available for H.264/H.265/AV1 profiles; omit it to keep the selected profile default.')
          replace_once('docs/USER_GUIDE.md',
              'Choose **High Efficiency — H.265/HEVC 4:2:0 MP4** only for controlled destinations where HEVC support is known.',
              'Choose **High Efficiency — H.265/HEVC 4:2:0 MP4** only for controlled destinations where HEVC support is known. Choose **High Efficiency — AV1 4:2:0 MP4** for modern destinations where AV1 playback/upload support is known and slower software encoding is acceptable.')

          hevc = ('An optional **High Efficiency — H.265/HEVC 4:2:0 MP4** profile uses\n'
                  '`libx265`, CRF 10 / slow, Main 8-bit 4:2:0, `hvc1`, the same explicit colour\n'
                  'metadata, 30 Mb/s maximum rate with a 60 Mb buffer, fast-start MP4, and AAC-LC\n'
                  '48 kHz stereo audio defaults. It is intended for controlled modern-device\n'
                  'workflows where HEVC support has been verified. It is **not** the Social delivery\n'
                  'default because browser/player/upload acceptance is less universal than H.264.\n\n')
          av1 = ('An optional **High Efficiency — AV1 4:2:0 MP4** profile uses\n'
                 '`libaom-av1`, CRF 18, `cpu-used 6`, row multithreading, Main 8-bit 4:2:0,\n'
                 '`av01`, the same explicit colour metadata, fast-start MP4, and AAC-LC 48 kHz\n'
                 'stereo audio defaults. AV1 constant-quality mode uses `-b:v 0`; it intentionally\n'
                 'does not set the H.264/HEVC 30M/60M VBV guardrail because packaged libaom rejects\n'
                 'maxrate/buffer constraints when no target bitrate is set. AV1 is opt-in because\n'
                 'software encoding is slower and playback/upload/editor acceptance varies more\n'
                 'than H.264.\n\n')
          replace_once('docs/DELIVERY_COMPATIBILITY.md', hevc, hevc + av1)
          replace_once('docs/DELIVERY_COMPATIBILITY.md',
              'Both H.264 and HEVC allow an optional per-job CRF override from 1–51. Leaving it blank keeps the tested profile default. Lower CRF raises quality and usually file size; the 30M/60M VBV guardrail still applies, so a very low manual CRF is a request for higher quality within that delivery bound rather than an uncapped mode.',
              'H.264, HEVC, and AV1 allow an optional per-job CRF override from 1–51. Leaving it blank keeps the tested profile default. Lower CRF raises quality and usually file size. The 30M/60M VBV guardrail applies to H.264/HEVC; AV1 stays in libaom constant-quality mode without a bitrate ceiling.')
          replace_once('docs/DELIVERY_COMPATIBILITY.md',
              'python cli.py source.html --recipe social_delivery --profile h265_420_mp4 --output delivery-hevc.mp4\n```\n',
              'python cli.py source.html --recipe social_delivery --profile h265_420_mp4 --output delivery-hevc.mp4\n```\n\nFor opt-in AV1:\n\n```bash\npython cli.py source.html --recipe social_delivery --profile av1_420_mp4 --output delivery-av1.mp4\n```\n')
          replace_once('docs/DELIVERY_COMPATIBILITY.md',
              "TikTok's Content Posting API media-transfer guide currently lists H.264 and\nH.265 as supported codecs while recommending H.264. Account duration limits and\nother upload rules also apply.",
              "TikTok's Content Posting API media-transfer guide currently lists H.264 and\nH.265 as supported codecs while recommending H.264; AV1 is not listed there, so\nthis AV1 profile should not be assumed to be accepted by that API. Account duration\nlimits and other upload rules also apply.")
          replace_once('docs/DELIVERY_COMPATIBILITY.md',
              'real CLI/browser H.264 and HEVC exports with external audio, GOP boundaries,',
              'real CLI/browser H.264, HEVC and AV1 exports with external audio, GOP boundaries,')

          replace_once('CHANGELOG.md',
              '- Add an optional per-job H.264/H.265 CRF override (1–51) in the desktop, CLI, Python/project model, and renderer while preserving each profile default when unset.\n',
              '- Add an optional per-job H.264/H.265/AV1 CRF override (1–51) in the desktop, CLI, Python/project model, and renderer while preserving each profile default when unset.\n- Add an opt-in AV1 Main 8-bit 4:2:0 MP4 profile using portable `libaom-av1`, CRF 18, `av01`, fast-start MP4, explicit BT.709/sRGB metadata, and AAC-LC audio.\n')

          subprocess.run([sys.executable, 'tools/generate_reference.py'], check=True)
          subprocess.run([sys.executable, '-m', 'compileall', '-q', 'app.py', 'cli.py', 'media_pipeline.py', 'models.py', 'presets.py', 'renderer.py', 'tests/test_quality_profiles.py'], check=True)
          PY
          python -m unittest discover -s tests -p test_quality_profiles.py -v
          python tools/check_docs.py
          git rm .github/workflows/_probe_av1.yml .github/workflows/_add_av1.yml
      - name: Commit AV1 support
        shell: bash
        run: |
          git config user.name "Untitled1-Agent"
          git config user.email "untitled1-openclaw@protonmail.com"
          git add -A
          git commit -m "feat: add portable AV1 MP4 output"
          git push origin HEAD:feat/social-crf-x265-quality
