name: Fix manual CRF range

on:
  push:
    branches: [feat/social-crf-x265-quality]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/social-crf-x265-quality
      - run: python -m pip install -r requirements-dev.txt
      - name: Tighten CRF override range
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def rep(path, old, new, count=1):
              p=Path(path); text=p.read_text(encoding='utf-8')
              actual=text.count(old)
              if actual != count:
                  raise SystemExit(f'{path}: expected {count} matches, found {actual}: {old!r}')
              p.write_text(text.replace(old,new), encoding='utf-8')

          rep('models.py', 'if not 0 <= crf <= 51:', 'if not 1 <= crf <= 51:')
          rep('models.py', "raise ValueError('Manual CRF must be between 0 and 51.')", "raise ValueError('Manual CRF must be between 1 and 51.')")
          rep('cli.py', 'if not math.isfinite(crf) or not 0 <= crf <= 51:', 'if not math.isfinite(crf) or not 1 <= crf <= 51:')
          rep('cli.py', 'raise argparse.ArgumentTypeError("CRF must be between 0 and 51.")', 'raise argparse.ArgumentTypeError("CRF must be between 1 and 51.")')
          rep('cli.py', 'help="Override H.264/H.265 CRF (0-51); omit to use the profile default."', 'help="Override H.264/H.265 CRF (1-51); omit to use the profile default."')
          rep('media_pipeline.py', 'if not 0 <= crf <= 51:', 'if not 1 <= crf <= 51:')
          rep('media_pipeline.py', "raise ValueError('Manual CRF must be between 0 and 51.')", "raise ValueError('Manual CRF must be between 1 and 51.')")
          rep('app.py', 'ttk.Spinbox(tab, from_=0, to=51, increment=0.5, textvariable=self.crf_var)', 'ttk.Spinbox(tab, from_=1, to=51, increment=0.5, textvariable=self.crf_var)')
          rep('app.py', 'tab, 4, "CRF override (0–51)", self.crf_widget,', 'tab, 4, "CRF override (1–51)", self.crf_widget,')
          rep('tests/test_quality_profiles.py', 'for value in (-1, 51.1, float("nan"), True):', 'for value in (0, -1, 51.1, float("nan"), True):')

          for path in ('README.md','docs/CLI.md','docs/USER_GUIDE.md','docs/DELIVERY_COMPATIBILITY.md','CHANGELOG.md'):
              p=Path(path); text=p.read_text(encoding='utf-8')
              if '0–51' in text: text=text.replace('0–51','1–51')
              if '0-51' in text: text=text.replace('0-51','1-51')
              if '0 through 51' in text: text=text.replace('0 through 51','1 through 51')
              p.write_text(text, encoding='utf-8')
          PY
          python tools/generate_reference.py
          python -m unittest discover -s tests -p test_quality_profiles.py -v
          python tools/check_docs.py
      - name: Commit CRF range fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add models.py cli.py media_pipeline.py app.py tests/test_quality_profiles.py README.md docs/CLI.md docs/USER_GUIDE.md docs/DELIVERY_COMPATIBILITY.md docs/CONFIGURATION.md CHANGELOG.md
          git commit -m 'fix: keep manual CRF compatible with H.264 Main'
          git push origin HEAD:feat/social-crf-x265-quality
