name: Probe AV1 encoders
on:
  push:
    branches: [feat/social-crf-x265-quality]
permissions:
  contents: read
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/social-crf-x265-quality
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - run: python -m pip install imageio-ffmpeg
      - name: Probe packaged FFmpeg AV1 encoders
        shell: python
        run: |
          import imageio_ffmpeg, subprocess, tempfile
          from pathlib import Path
          ffmpeg=imageio_ffmpeg.get_ffmpeg_exe()
          print('FFMPEG', ffmpeg)
          enc=subprocess.run([ffmpeg,'-hide_banner','-encoders'],capture_output=True,text=True,check=True).stdout
          for name in ('libsvtav1','libaom-av1','librav1e','av1_nvenc','av1_qsv'):
              print(name, 'YES' if name in enc else 'NO')
          payload=bytes([0,0,0] * 64 * 64 * 4)
          for name, extra in (
              ('libsvtav1',['-preset','10','-crf','30']),
              ('libaom-av1',['-cpu-used','8','-crf','30','-b:v','0']),
          ):
              if name not in enc:
                  continue
              with tempfile.TemporaryDirectory() as d:
                  out=Path(d)/f'{name}.mp4'
                  cmd=[ffmpeg,'-hide_banner','-loglevel','error','-y','-f','rawvideo','-pix_fmt','rgb24','-s:v','64x64','-r','10','-i','pipe:0','-frames:v','4','-c:v',name,*extra,'-pix_fmt','yuv420p','-tag:v','av01','-movflags','+faststart',str(out)]
                  r=subprocess.run(cmd,input=payload,capture_output=True,timeout=60)
                  print(name,'ENCODE_RC',r.returncode,r.stderr.decode(errors='replace'))
                  if r.returncode==0:
                      dres=subprocess.run([ffmpeg,'-hide_banner','-loglevel','error','-xerror','-i',str(out),'-map','0:v:0','-f','null','-'],capture_output=True,timeout=30)
                      print(name,'DECODE_RC',dres.returncode,dres.stderr.decode(errors='replace'))
