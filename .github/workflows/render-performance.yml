name: Render performance
on:
  push:
    branches: [perf/parallel-browser-capture]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Source fingerprints
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          for name in ['renderer.py']:
              data = Path(name).read_bytes()
              lines = data.splitlines(keepends=True)
              print(name, len(data), len(lines))
              for start in range(0, len(lines), 100):
                  print(start + 1, hashlib.sha256(b''.join(lines[start:start+100])).hexdigest())
          PY
