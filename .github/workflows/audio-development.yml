name: Audio implementation validation
on:
  push:
    branches: [feat/per-html-audio-sync]
    paths: [tools/_apply_audio_patch.py]
permissions:
  contents: read
jobs:
  implement-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/per-html-audio-sync
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Install desktop, browser, and codec dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk xvfb ffmpeg
          python -m pip install -r requirements-dev.txt
          python -m playwright install --with-deps chromium
      - name: Apply reviewed changes on the feature branch
        run: |
          python tools/_apply_audio_patch.py
          python tools/generate_reference.py
          git rm tools/_apply_audio_patch.py .github/workflows/audio-development.yml
          git add models.py media_pipeline.py renderer.py app.py cli.py presets.py docs README.md tests .github/workflows/tests.yml
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Add per-HTML soundtracks, signed sync, and configurable audio delivery'
          git push origin HEAD:feat/per-html-audio-sync
          git rev-parse HEAD
      - name: Documentation and metadata consistency
        run: python tools/check_docs.py
      - name: Full regression gate including audio and desktop tests
        run: xvfb-run -a python -W error::ResourceWarning tools/validate.py
      - name: Browser codec and filter matrix
        run: python tests/profile_matrix.py
      - name: Build and validate distributions
        run: |
          python -m build
          python tools/package_release.py dist
