name: Fix quality documentation consistency

on:
  push:
    branches: [feat/social-crf-x265-quality]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/social-crf-x265-quality
      - name: Patch README and user guide
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          readme = Path('README.md')
          text = readme.read_text(encoding='utf-8')
          old = '> **Sharp, compatible exports by default:** “Social delivery” uses 1× / 60 fps, 8-bit H.264 Main 4:2:0 MP4 and CAS 0.28 clarity. Use it for mobile playback and social uploads. “Exact source master” remains an explicit lossless RGB / No processing option for archival fidelity, not a mobile-delivery format. [VLC / Android / TikTok compatibility](docs/DELIVERY_COMPATIBILITY.md).'
          new = '> **Sharp, compatible exports by default:** “Social delivery” uses 1× / 60 fps, 8-bit H.264 Main 4:2:0 MP4 and CAS 0.28 clarity. Use it for mobile playback and social uploads. An opt-in H.265/HEVC 4:2:0 MP4 profile is available for controlled destinations where HEVC support is known; H.264 remains the compatibility default. “Exact source master” remains an explicit lossless RGB / No processing option for archival fidelity, not a mobile-delivery format. [VLC / Android / TikTok compatibility](docs/DELIVERY_COMPATIBILITY.md).'
          if text.count(old) != 1:
              raise SystemExit('README compatibility callout did not match exactly once')
          text = text.replace(old, new)
          old_rows = '| H.264 Main 4:2:0 (default) | MP4 | Mobile playback and social uploads | Chroma subsampling can soften saturated text |\n| VP9 4:4:4 | WebM | Web-oriented delivery | Encoding speed and player/editor support vary |'
          new_rows = '| H.264 Main 4:2:0 (default) | MP4 | Mobile playback and social uploads | Chroma subsampling can soften saturated text |\n| H.265/HEVC Main 4:2:0 | MP4 | Efficient delivery where HEVC support is known | Less universal playback/upload compatibility than H.264 |\n| VP9 4:4:4 | WebM | Web-oriented delivery | Encoding speed and player/editor support vary |'
          if text.count(old_rows) != 1:
              raise SystemExit('README profile table did not match exactly once')
          readme.write_text(text.replace(old_rows, new_rows), encoding='utf-8')

          guide = Path('docs/USER_GUIDE.md')
          text = guide.read_text(encoding='utf-8')
          old = 'For authored motion graphics, use **Exact source master** as the baseline: 2× browser rasterization, 60 fps, lossless RGB, No processing. For a browser/player-friendly copy choose Social delivery, then inspect its default sharpening and chroma tradeoff. For transparency choose ProRes 4444, transparent capture, and No processing.'
          new = 'For authored motion graphics, use **Exact source master** as the baseline: 2× browser rasterization, 60 fps, lossless RGB, No processing. For the broadest browser/player/social compatibility choose Social delivery, then inspect its default sharpening and chroma tradeoff. Choose **High Efficiency — H.265/HEVC 4:2:0 MP4** only for controlled destinations where HEVC support is known. For transparency choose ProRes 4444, transparent capture, and No processing.'
          if text.count(old) != 1:
              raise SystemExit('USER_GUIDE profile guidance did not match exactly once')
          guide.write_text(text.replace(old, new), encoding='utf-8')
          PY
      - name: Commit documentation fix
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md docs/USER_GUIDE.md
          git commit -m 'docs: expose optional HEVC profile in user guidance'
          git push origin HEAD:feat/social-crf-x265-quality
